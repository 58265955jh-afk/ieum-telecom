<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 | 이음통신</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 20px;
background:radial-gradient(900px 460px at 80% 0%,rgba(18,199,160,.16),transparent 62%),
radial-gradient(760px 400px at 10% 100%,rgba(31,111,235,.12),transparent 60%),#F5F9FE;
font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#43596F;word-break:keep-all}
.box{max-width:520px;text-align:center;background:#fff;border:1px solid #DEE7F3;border-radius:26px;padding:48px 32px;box-shadow:0 2px 6px rgba(10,39,71,.05),0 22px 48px rgba(10,39,71,.09)}
.code{font-family:'Manrope',sans-serif;font-size:13px;font-weight:800;letter-spacing:.2em;color:#0A7C64}
h1{margin:14px 0 0;font-size:26px;font-weight:900;letter-spacing:-.05em;color:#0A2747;line-height:1.35}
p{margin:14px 0 0;font-size:14.5px;line-height:1.75}
a{display:inline-flex;align-items:center;gap:8px;margin-top:26px;background:#0A2747;color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:14px 24px;border-radius:12px;transition:background .2s,transform .2s}
a:hover{background:#123A66;transform:translateY(-2px)}
.tel{margin-top:14px;font-size:13px;color:#6C8199}
.tel b{font-family:'Manrope',sans-serif;color:#0A2747;letter-spacing:.02em}
</style>
</head>
<body>
<main class="box">
  <span class="code">404</span>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>주소가 바뀌었거나 삭제된 페이지입니다.<br>이음통신 홈에서 개통 안내를 확인하세요.</p>
  <a href="./">이음통신 홈으로 가기</a>
  <p class="tel">전화 상담 <b>010-7705-5955</b></p>
</main>
</body>
</html>
